# Translator API + Ollama. Pull the model after Ollama is up, e.g.:
#   docker compose exec ollama ollama pull deepseek-r1:1.5b
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  translator:
    build: .
    ports:
      - "8080:8080"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: deepseek-r1:1.5b
    depends_on:
      - ollama

volumes:
  ollama_data:
